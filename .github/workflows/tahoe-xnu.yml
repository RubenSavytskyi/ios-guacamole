name: Tahoe XNU 12377 SWEET

on:
  workflow_dispatch:
    inputs:
      keep_going:
        description: Collect all compiler errors in one run
        type: boolean
        default: true
  push:
    branches: [guacamole-touch]
    paths:
      - ".github/workflows/tahoe-xnu.yml"
      - "xnu/patches/tahoe/**"

concurrency:
  group: tahoe-xnu-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: "26.5"
  KERNEL_CONFIG: DEVELOPMENT
  MACHINE_CONFIG: SWEET

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Tahoe build driver and SWEET patches
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          mkdir -p dxb/patches/26.0
          cp xnu/patches/tahoe/*.patch dxb/patches/26.0/
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64" VALID_ARCHS="x86_64 arm64"/' dxb/build.sh
          grep -c 'ARCHS="x86_64 arm64"' dxb/build.sh
          ls dxb/patches

      - name: Dependencies and Xcode
        run: |
          brew install jq gum bash cmake ninja
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          # Explicit, non-beta Xcode 26.x. Do not use `sort | tail`: that
          # silently picks a beta/RC or an unexpected version.
          XC=""
          for CAND in \
            /Applications/Xcode_26.5.app \
            /Applications/Xcode_26.5.0.app \
            /Applications/Xcode_26.4.1.app \
            /Applications/Xcode_26.3.0.app \
            /Applications/Xcode_26.3.app; do
            if [ -d "$CAND" ]; then XC="$CAND"; break; fi
          done
          if [ -z "$XC" ]; then
            echo "No Xcode 26.x found. Installed:"; ls -d /Applications/Xcode*.app
            exit 1
          fi
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          SDKVER=$(xcrun --sdk macosx --show-sdk-version)
          echo "macOS SDK version: $SDKVER"
          case "$SDKVER" in
            26.*) ;;
            *) echo "Expected an SDK starting with 26, got $SDKVER"; exit 1 ;;
          esac
          xcrun --find iig

      - name: Build XNU 12377 for SWEET
        working-directory: dxb
        env:
          MAKEFLAGS: ${{ (github.event_name != 'workflow_dispatch' || inputs.keep_going) && '-k' || '' }}
        run: |
          # Without pipefail, tee masks a failing build.sh and the step goes
          # green with no kernel (run 44271872336 did exactly that).
          set -o pipefail
          bash build.sh 2>&1 | tee build.log

      - name: Collect kernel and build context
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          KERNEL=$( { find dxb/build dxb/fakeroot -name '*.dSYM' -prune -o \
            -type f -name 'kernel.development.*' -print 2>/dev/null || true; } | head -1 )
          if [ -n "$KERNEL" ]; then
            cp "$KERNEL" out/
            echo "kernel: $KERNEL"
            file "out/$(basename "$KERNEL")" || true
            lipo -info "out/$(basename "$KERNEL")" || true
          else
            echo "::error::no kernel.development.* was produced"
            exit 1
          fi
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p sdk-kernel-platform
          cp -R "$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform" sdk-kernel-platform/ || true
          tar czf out/buildtree.tgz \
            --exclude='*.o' --exclude='*.cpo' --exclude='*.a' --exclude='*.dSYM' --exclude='*.unstripped' \
            --exclude='kernel.development.*' --exclude='.git' \
            -C dxb build/xnu.obj fakeroot/usr/local/include xnu build.log \
            -C .. sdk-kernel-platform
          ls -la out
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-buildtree
          path: out/
          if-no-files-found: warn
          retention-days: 7
